name: Build Piyoko for Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Android arm64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Godot with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Export Android debug APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/Piyoko-debug.apk
          test -s build/android/Piyoko-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Piyoko-Android-arm64-debug
          path: build/android/Piyoko-debug.apk
          if-no-files-found: error
          retention-days: 30
