name: Build Piyoko for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows 11 x64 build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Godot with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Export Windows executable
        run: |
          mkdir -p build/package/Piyoko/licenses
          godot --headless --path . --export-release "Windows Desktop" build/package/Piyoko/Piyoko.exe
          cp README_DISTRIBUTION.txt build/package/Piyoko/README.txt
          cp VERSION.txt build/package/Piyoko/VERSION.txt
          cp LICENSE build/package/Piyoko/LICENSE.txt
          cp licenses/THIRD_PARTY_NOTICES.md build/package/Piyoko/licenses/
          cp licenses/audio_sources.md build/package/Piyoko/licenses/
          test -s build/package/Piyoko/Piyoko.exe
          test -s build/package/Piyoko/README.txt
          test -s build/package/Piyoko/LICENSE.txt
          test -s build/package/Piyoko/licenses/THIRD_PARTY_NOTICES.md

      - name: Verify distribution package
        run: |
          test "$(cat build/package/Piyoko/VERSION.txt)" = "1.0.1"
          find build/package/Piyoko -maxdepth 2 -type f -print | sort

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Piyoko-Windows-x64-v1.0.1
          path: build/package/Piyoko
          if-no-files-found: error
          retention-days: 30
