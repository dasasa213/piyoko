name: Build Piyoko for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows 11 x64 build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Godot with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Export Windows executable
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/Piyoko.exe
          test -s build/windows/Piyoko.exe

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Piyoko-Windows-x64
          path: build/windows/Piyoko.exe
          if-no-files-found: error
          retention-days: 30
