name: Piyoko Automated Full Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-test:
    name: Godot 4.7.2 headless test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Run full automated test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/automated/run_all_tests.gd 2>&1 | tee godot-test.log
          if grep -E "SCRIPT ERROR:|FAIL:|Error calling from signal|Failed to load script" godot-test.log; then
            echo "Godot runtime errors were detected."
            exit 1
          fi
          grep -E "=== result: [0-9]+ checks / 0 failures ===" godot-test.log
