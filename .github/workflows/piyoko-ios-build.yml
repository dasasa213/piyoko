name: Piyoko iOS Xcode Project

on:
  push:
    branches: [feature/ios-support]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-xcode-project:
    name: iOS Xcode project
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Export iOS Xcode project
        run: |
          mkdir -p build/ios
          godot --headless --path . --export-debug "iOS" build/ios/Piyoko-iOS-v1.0.1.zip
          test -s build/ios/Piyoko-iOS-v1.0.1.zip
          unzip -l build/ios/Piyoko-iOS-v1.0.1.zip | grep -q "Piyoko.xcodeproj/project.pbxproj"

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: Piyoko-iOS-Xcode-v1.0.1
          path: build/ios/Piyoko-iOS-v1.0.1.zip
          if-no-files-found: error
          retention-days: 14
